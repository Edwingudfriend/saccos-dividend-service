server:
  port: 8089
  servlet:
    context-path: /dividend-service

spring:
  application:
    name: saccos-dividend-service

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/${DB_NAME:dividend_db}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:saccos-rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Fineract integration
fineract:
  base-url: ${FINERACT_BASE_URL:http://mifos-fineract:8443/fineract-provider/api/v1}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  tenant: ${FINERACT_TENANT:default}

# JWT
jwt:
  secret: ${JWT_SECRET:saccos-platform-secret-key-reimagineafrica-2024}
  expiration: 86400000

# Tanzania Revenue Authority WHT rate on dividends
tza:
  wht-rate: 0.05  # 5% withholding tax on dividends

logging:
  level:
    com.reimagineafrica: DEBUG
    org.springframework.amqp: INFO
